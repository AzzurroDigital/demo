<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#faf6ef">
<meta name="color-scheme" content="light">
<title>Cooking with Chef Bruno — Zadar</title>
<meta name="description" content="Radionice kuhanja s Brunom Kalmetom u Zadru — dalmatinska riba, brudet i tjestenina rađena rukom. Cooking workshops with chef Bruno Kalmeta in Zadar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap&subset=latin,latin-ext" rel="stylesheet">
<style>
:root{
  --cream:#faf6ef; --cream-2:#f3ece0; --card:#ffffff;
  --ink:#1c1a17; --ink-2:#4a453d; --muted:#7c7466;
  --terra:#b5532c; --terra-d:#98421f; --sea:#165266;
  --line:#e6dcce;
  --head:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --pad:clamp(20px,5vw,56px); --maxw:1140px;
  --ease:cubic-bezier(.23,1,.32,1); --r:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--head);font-weight:500;line-height:1.14;letter-spacing:-.01em}
button,a,[role="button"]{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,select,textarea{font-size:16px}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--terra);margin:0 0 14px}
section{padding:clamp(50px,8vw,92px) 0;scroll-margin-top:84px}
.tint{background:var(--cream-2)}
.sec-head h2{font-size:clamp(29px,5.6vw,46px)}
.sec-head p{color:var(--ink-2);max-width:58ch;margin:16px 0 0}

.reveal{opacity:0;transform:translateY(12px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:calc(var(--i,0) * 65ms)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

.workbar{background:#2b2620;color:#f0e7d9;font-size:12px;line-height:1.5;padding:9px var(--pad);text-align:center;padding-top:calc(9px + env(safe-area-inset-top,0px))}
.workbar b{color:#fff;font-weight:600}

header{position:sticky;top:0;z-index:40;background:rgba(250,246,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.logo{text-decoration:none;line-height:1.15}
.logo b{display:block;font-family:var(--head);font-size:19px;font-weight:600}
.logo small{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.nav nav{display:none;gap:24px}
.nav nav a{font-size:14px;text-decoration:none;color:var(--ink-2);transition:color .2s var(--ease)}
.navright{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 13px;cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.navcta{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 25px;border-radius:999px;background:var(--terra);color:#fff;border:1px solid var(--terra);font-size:15px;font-weight:600;font-family:var(--body);text-decoration:none;cursor:pointer;transition:transform .16s var(--ease),background .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.line{background:transparent;color:var(--ink);border-color:var(--ink)}
@media(hover:hover) and (pointer:fine){
  .btn:hover{background:var(--terra-d);border-color:var(--terra-d)}
  .btn.line:hover{background:var(--ink);color:#fff}
  .nav nav a:hover{color:var(--terra)}
  .shot:hover img{transform:scale(1.04)}
  .lang button:hover{color:var(--ink)}
}

.hero{padding:clamp(28px,5vw,56px) 0 clamp(34px,6vw,64px)}
.herogrid{display:grid;gap:28px;grid-template-columns:1fr;align-items:center}
.hero h1{font-size:clamp(34px,7.6vw,60px);font-weight:600}
.hero h1 em{font-style:italic;color:var(--terra)}
.hero p.lead{color:var(--ink-2);font-size:clamp(16px,2.2vw,19px);margin:18px 0 0;max-width:46ch}
.hero .cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:26px}
.heroimg{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.heroimg img{width:100%;aspect-ratio:16/10;object-fit:cover}

.meta{display:grid;gap:10px;grid-template-columns:1fr;margin-top:28px}
.mi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.mi b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.mi span{font-size:14px;color:var(--muted)}

.bio{display:grid;gap:26px;grid-template-columns:1fr;align-items:center}
.bio .txt p{color:var(--ink-2)}
.bio img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);border:1px solid var(--line)}
.srcnote{font-size:12.5px;color:var(--muted);border-left:2px solid var(--terra);padding-left:12px;margin-top:18px}

.cards{display:grid;gap:16px;margin-top:36px;grid-template-columns:1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:16/10;overflow:hidden;background:var(--cream-2)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.card .body{padding:22px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:22px}
.card p{margin:0;font-size:15px;color:var(--ink-2)}
.card ul{list-style:none;margin:0;padding:0}
.card li{position:relative;padding-left:18px;font-size:14.5px;color:var(--muted);margin-bottom:6px}
.card li::before{content:"";position:absolute;left:0;top:11px;width:8px;height:1px;background:var(--terra)}
.card .foot{margin-top:auto;padding-top:8px;font-size:13px;color:var(--terra);font-weight:600}

.steps{display:grid;gap:14px;margin-top:36px;grid-template-columns:1fr}
.stepx{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 20px}
.stepx b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:999px;background:var(--cream-2);color:var(--terra);font-weight:700;font-size:14px;margin-bottom:10px;font-family:var(--body)}
.stepx h4{font-size:19px;margin-bottom:6px}
.stepx p{margin:0;font-size:14.5px;color:var(--muted)}

.shots{display:grid;gap:12px;margin-top:34px;grid-template-columns:1fr}
.shot{margin:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#fff}
.shot img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .5s var(--ease)}
.shot figcaption{font-size:13px;color:var(--muted);padding:11px 14px}

.split{display:grid;gap:28px;margin-top:36px;grid-template-columns:1fr}
form{display:grid;gap:14px}
label{font-size:13px;font-weight:600;color:var(--ink-2)}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:13px 14px;font-family:var(--body);transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--terra);box-shadow:0 0 0 3px rgba(181,83,44,.14)}
textarea{min-height:110px;resize:vertical}
.field{display:grid;gap:6px}
.two{display:grid;gap:14px;grid-template-columns:1fr}
.formnote{font-size:13px;color:var(--muted);margin:0}
.sent{border:1px solid #cfe0c7;background:#f2f8ef;border-radius:10px;padding:14px;font-size:14px;color:#3a6b2c;display:none}
.sent.show{display:block;animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.infobox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px 22px}
.infobox h3{font-size:20px;margin-bottom:14px}
.cl{display:block;text-decoration:none;color:var(--ink-2);padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.cl:last-of-type{border-bottom:0}
.cl b{display:block;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}

footer{border-top:1px solid var(--line);padding:38px 0 calc(92px + env(safe-area-inset-bottom,0px));background:var(--cream-2)}
.foot{display:grid;gap:18px;grid-template-columns:1fr}
.foot p{margin:0;color:var(--muted);font-size:14px}
.foot h4{font-size:17px;margin-bottom:8px}
.credit{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:#8d8577}

.mobilebar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(250,246,239,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.mobilebar .btn{flex:1;padding:14px 10px;font-size:15px}

@media(min-width:700px){
  .meta{grid-template-columns:repeat(3,1fr)}
  .cards{grid-template-columns:repeat(3,1fr)}
  .steps{grid-template-columns:repeat(4,1fr)}
  .shots{grid-template-columns:repeat(3,1fr)}
  .two{grid-template-columns:1fr 1fr}
  .bio{grid-template-columns:1fr 1fr;gap:40px}
}
@media(min-width:1000px){
  .nav nav{display:flex}
  .navcta{display:inline-flex}
  .herogrid{grid-template-columns:1.02fr .98fr;gap:46px}
  .split{grid-template-columns:1.1fr .9fr;gap:42px}
  .foot{grid-template-columns:1.4fr 1fr 1fr}
  footer{padding-bottom:38px}
  .mobilebar{display:none}
  body{font-size:17px}
}
</style>
</head>

        <p class="eyebrow" data-hr="O Brunu" data-en="About Bruno"></p>
        <h2 data-hr="Bruno Kalmeta" data-en="Bruno Kalmeta"></h2>
        <p style="margin-top:16px" data-hr="Bruno je glavni kuhar restorana Karma u Zadru. Prije toga kuhao je u restoranu Corte u hotelu Almayer, sezone je radio na Kornatima i u šibenskom resortu, a jedno je vrijeme radio i u Njemačkoj. Kuharsku školu završio je u Zagrebu." data-en="Bruno is head chef at Karma restaurant in Zadar. Before that he cooked at Corte in Hotel Almayer, worked seasons in the Kornati islands and at a resort near Šibenik, and spent time working in Germany. He trained at a culinary school in Zagreb."></p>
        <p data-hr="Kuha dalmatinski, s naglaskom na lokalnu ribu i domaće namirnice, uz modernije tehnike. Na radionicama se to svodi na jednostavnu stvar: kako od dobrog sastojka napraviti jelo koje ćete ponoviti i kod kuće." data-en="He cooks Dalmatian, leaning on local fish and home-grown ingredients, with modern technique. In the workshops it comes down to one thing: how to turn a good ingredient into a dish you can cook again at home."></p>
        <p class="srcnote" data-hr="Podaci o karijeri preuzeti su iz medijskih objava (Follow.hr, 023.hr). Prije objave stranice potvrditi ih s Brunom i zamijeniti fotografije njegovima." data-en="Career details are taken from press coverage (Follow.hr, 023.hr). Confirm them with Bruno and replace the photographs with his own before the site goes live."></p>

      <h2 data-hr="Od tržnice do stola" data-en="From the market to the table"></h2>
      <p data-hr="Radionica nije predavanje. Kuhate vi, Bruno vodi i objašnjava zašto se nešto radi baš tako." data-en="The workshop is not a lecture. You do the cooking; Bruno leads and explains why things are done the way they are."></p>

<section id="prijava">
  <div class="wrap">
    <div class="sec-head reveal">
      <p class="eyebrow" data-hr="Prijava" data-en="Booking"></p>
      <h2 data-hr="Rezervirajte termin" data-en="Reserve a date"></h2>
      <p data-hr="Napišite koliko vas je i kada biste došli. Javljamo se s potvrdom termina, cijenom i adresom." data-en="Tell us how many of you there are and when you would come. We reply with the date, the price and the address."></p>
    </div>
    <div class="split">
      <div class="reveal">
        <form id="prijavaform" novalidate>
          <div class="two">
            <div class="field"><label for="ime" data-hr="Ime i prezime" data-en="Full name"></label><input id="ime" type="text" autocomplete="name" enterkeyhint="next" required></div>
            <div class="field"><label for="mail" data-hr="E-mail" data-en="Email"></label><input id="mail" type="email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" enterkeyhint="next" required></div>
          </div>
          <div class="two">
            <div class="field"><label for="tip" data-hr="Radionica" data-en="Workshop"></label>
              <select id="tip">
                <option data-hr="Riba i brudet" data-en="Fish and brudet"></option>
                <option data-hr="Tjestenina i njoki" data-en="Pasta and gnocchi"></option>
                <option data-hr="Privatna radionica" data-en="Private session"></option>
                <option data-hr="Nisam siguran, trebam savjet" data-en="Not sure yet, need advice"></option>
              </select>
            </div>
            <div class="field"><label for="osoba" data-hr="Broj osoba" data-en="Number of people"></label><input id="osoba" type="number" inputmode="numeric" min="1" max="20" value="2" enterkeyhint="next"></div>
          </div>
          <div class="two">
            <div class="field"><label for="datum" data-hr="Željeni datum" data-en="Preferred date"></label><input id="datum" type="date"></div>
            <div class="field"><label for="jezik" data-hr="Jezik radionice" data-en="Workshop language"></label>
              <select id="jezik"><option>Hrvatski</option><option>English</option></select>
            </div>
          </div>
          <div class="field"><label for="poruka" data-hr="Poruka" data-en="Message"></label><textarea id="poruka" enterkeyhint="done"></textarea></div>
          <button class="btn" type="submit" style="justify-self:start" data-hr="Pošalji prijavu" data-en="Send booking request"></button>
          <div class="sent" id="sent" data-hr="Hvala. Ovo je radna verzija stranice pa se poruka još ne šalje — kad stranica bude živa, prijava stiže izravno na mail." data-en="Thank you. This is a working version, so the message is not sent yet — once the site is live, bookings arrive straight to the inbox."></div>
          <p class="formnote" data-hr="Alergije i prehrambena ograničenja javite u poruci, meni se prilagođava." data-en="Tell us about allergies or dietary limits in the message and the menu is adjusted."></p>
        </form>
      </div>
      <div class="reveal" style="--i:1">
        <div class="infobox">
          <h3 data-hr="Kontakt" data-en="Contact"></h3>
          <a class="cl" href="#prijava"><b data-hr="Telefon" data-en="Phone"></b><span data-hr="upisuje se broj" data-en="number to be added"></span></a>
          <a class="cl" href="#prijava"><b data-hr="E-mail" data-en="Email"></b><span data-hr="upisuje se adresa" data-en="address to be added"></span></a>
          <a class="cl" href="#prijava"><b data-hr="Instagram" data-en="Instagram"></b><span data-hr="upisuje se profil" data-en="profile to be added"></span></a>
          <a class="cl" href="#prijava"><b data-hr="Lokacija" data-en="Location"></b><span data-hr="Zadar, točna adresa uz potvrdu termina" data-en="Zadar, exact address with your booking"></span></a>
          <p class="formnote" style="margin-top:14px" data-hr="Kontakti su prazni dok ih Bruno ne potvrdi." data-en="Contact details stay empty until Bruno confirms them."></p>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  var nodes=document.querySelectorAll('[data-hr]');
  var btns=document.querySelectorAll('.lang button');
  function apply(lang){
    document.documentElement.lang = (lang==='en') ? 'en' : 'hr';
    nodes.forEach(function(n){
      var v=n.getAttribute('data-'+lang);
      if(v!==null) n.innerHTML=v;
    });
    btns.forEach(function(b){b.setAttribute('aria-pressed', String(b.dataset.lang===lang));});
    try{localStorage.setItem('cwb-lang',lang);}catch(e){}
  }
  var start='hr';
  try{
    var s=localStorage.getItem('cwb-lang');
    if(s==='hr'||s==='en'){start=s;}
    else if((navigator.language||'').slice(0,2).toLowerCase()!=='hr'){start='en';}
  }catch(e){}
  apply(start);
  btns.forEach(function(b){b.addEventListener('click',function(){apply(b.dataset.lang);});});

  var els=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)||window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    els.forEach(function(e){e.classList.add('in')});
  } else {
    var io=new IntersectionObserver(function(en){
      en.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});
    },{rootMargin:'0px 0px -6% 0px',threshold:.1});
    els.forEach(function(e){io.observe(e)});
  }
  document.getElementById('prijavaform').addEventListener('submit',function(e){
    e.preventDefault();
    var ime=document.getElementById('ime'),mail=document.getElementById('mail');
    if(!ime.value.trim()||!mail.value.trim()){(!ime.value.trim()?ime:mail).focus();return;}
    document.getElementById('sent').classList.add('show');
    var b=this.querySelector('button[type=submit]');
    b.textContent = (document.documentElement.lang==='en') ? 'Request sent' : 'Prijava poslana';
  });
})();
</script>
